<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem: Newspaper Page + AI Quill/Spark -->
  <g transform="translate(10, 10)">
    <!-- Page 1 (Back) -->
    <rect x="15" y="15" width="65" height="80" rx="6" fill="#1e293b" stroke="url(#logoGrad)" stroke-width="2" transform="rotate(-6 47 55)" opacity="0.7" />
    <!-- Page 2 (Front) -->
    <rect x="20" y="10" width="65" height="80" rx="6" fill="url(#logoGrad)" filter="url(#glow)" />

    <!-- Page Lines -->
    <line x1="32" y1="26" x2="70" y2="26" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="32" y1="38" x2="72" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="32" y1="48" x2="60" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="32" y1="58" x2="70" y2="58" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="32" y1="68" x2="52" y2="68" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- AI Neural Spark Star -->
    <path d="M 72 20 L 75 32 L 87 35 L 75 38 L 72 50 L 69 38 L 57 35 L 69 32 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="125" y="62" font-family="'Georgia', 'Newsreader', serif" font-size="42" font-weight="700" fill="#f8fafc" letter-spacing="1.5">CHRONICLE</text>
  <text x="380" y="62" font-family="'Inter', 'Helvetica', sans-serif" font-size="38" font-weight="900" fill="url(#logoGrad)" letter-spacing="2">AI</text>
  <text x="127" y="88" font-family="'JetBrains Mono', 'Courier', monospace" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="3.5">INTELLIGENT NEWSPAPER FRAMEWORK</text>
</svg>