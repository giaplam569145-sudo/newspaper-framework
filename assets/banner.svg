<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="100" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="320" r="250" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="200" r="180" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Border Top Accent -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accentGrad)" />

  <!-- Main Content Area -->
  <g transform="translate(80, 75)">
    <!-- Subtitle Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="16" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#60a5fa" letter-spacing="1.5">⚡ NEXT-GEN AI FRAMEWORK</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Georgia', 'Newsreader', serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="1">Chronicle AI</text>
    <text x="0" y="135" font-family="'Inter', sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Modular, Fault-Tolerant AI Newspaper Production &amp; Export</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 165)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="145" height="36" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📰 Interactive HTML</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="145" height="36" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🧩 Quizzes &amp; Puzzles</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌙 Dark / Light Mode</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(475, 0)">
        <rect x="0" y="0" width="135" height="36" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
        <text x="14" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 REST &amp; MCP API</text>
      </g>
    </g>

    <!-- Bottom Stat / Tech Line -->
    <text x="0" y="238" font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b">Python 3.12+ • Jinja2 • Flask • Dynamic Micro-Animations • Zero Latency</text>
  </g>

  <!-- Right Visual Mockup (Floating Interactive Newspaper Card) -->
  <g transform="translate(780, 55)">
    <rect x="0" y="0" width="340" height="300" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

    <!-- Mini Header -->
    <rect x="20" y="20" width="300" height="28" rx="6" fill="rgba(59, 130, 246, 0.2)" />
    <circle cx="35" cy="34" r="6" fill="#ef4444" />
    <circle cx="52" cy="34" r="6" fill="#f59e0b" />
    <circle cx="69" cy="34" r="6" fill="#10b981" />
    <rect x="110" y="28" width="120" height="12" rx="6" fill="rgba(255, 255, 255, 0.2)" />

    <!-- Article Preview -->
    <rect x="20" y="65" width="180" height="14" rx="4" fill="#f8fafc" />
    <rect x="20" y="88" width="300" height="8" rx="3" fill="#64748b" />
    <rect x="20" y="102" width="280" height="8" rx="3" fill="#64748b" />
    <rect x="20" y="116" width="220" height="8" rx="3" fill="#64748b" />

    <!-- Mini Sudoku / Quiz Widget Box -->
    <rect x="20" y="140" width="140" height="135" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
    <text x="32" y="162" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#60a5fa">SUDOKU GRID</text>
    <!-- Mini Grid -->
    <g transform="translate(32, 172)">
      <rect x="0" y="0" width="116" height="90" fill="none" stroke="#334155" stroke-width="1" />
      <line x1="38.6" y1="0" x2="38.6" y2="90" stroke="#3b82f6" stroke-width="1.5" />
      <line x1="77.3" y1="0" x2="77.3" y2="90" stroke="#3b82f6" stroke-width="1.5" />
      <line x1="0" y1="30" x2="116" y2="30" stroke="#3b82f6" stroke-width="1.5" />
      <line x1="0" y1="60" x2="116" y2="60" stroke="#3b82f6" stroke-width="1.5" />
      <text x="14" y="20" font-family="monospace" font-size="12" fill="#10b981" font-weight="bold">5</text>
      <text x="52" y="50" font-family="monospace" font-size="12" fill="#f8fafc">3</text>
      <text x="90" y="80" font-family="monospace" font-size="12" fill="#3b82f6" font-weight="bold">9</text>
    </g>

    <!-- Mini Quiz Widget Box -->
    <rect x="175" y="140" width="145" height="135" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <text x="187" y="162" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#34d399">QUIZ CHECK</text>
    <rect x="187" y="175" width="120" height="22" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
    <text x="197" y="190" font-family="'Inter', sans-serif" font-size="10" fill="#34d399" font-weight="bold">✓ Richtig!</text>
    <rect x="187" y="205" width="120" height="22" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" />
    <text x="197" y="220" font-family="'Inter', sans-serif" font-size="10" fill="#f87171">✗ Option B</text>
    <rect x="187" y="237" width="120" height="24" rx="6" fill="url(#accentGrad)" />
    <text x="212" y="253" font-family="'Inter', sans-serif" font-size="10" fill="#ffffff" font-weight="700">Prüfen</text>
  </g>
</svg>